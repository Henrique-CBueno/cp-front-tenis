<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1440px;height:900px;background:#1d4a33;color:#f4f1e8;overflow:hidden;font-family:"Arial Narrow",Arial,sans-serif}
.board{margin:60px;border:10px solid #0f2a1d;background:#0f2a1d}
.row{display:grid;grid-template-columns:380px 1fr 220px;gap:6px;margin-bottom:6px}
.row div{background:#132f21;padding:22px;font-size:42px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.row.h div{font-size:20px;background:#0f2a1d}
.row.live div:last-child{color:#d8692e}
.cta{position:absolute;left:60px;bottom:60px;background:#d8692e;padding:22px 34px;font-size:28px;font-weight:700;text-transform:uppercase}
</style></head><body><div class="board">
<div class="row h"><div>Court</div><div>Match</div><div>Statut</div></div>
<div class="row live"><div>Chatrier</div><div>Le Service</div><div>En cours</div></div>
<div class="row"><div>Lenglen</div><div>Terre Battue</div><div>Suivant</div></div>
<div class="row"><div>Mathieu</div><div>Histoire</div><div>13:00</div></div>
<div class="row"><div>Court 14</div><div>Kuerten 1997</div><div>Légende</div></div></div>
<div class="cta">Garanta seu ingresso</div></body></html>
